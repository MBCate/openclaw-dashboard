<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>论文日报 — OpenClaw Dashboard</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <div class="header">
    <h1>📚 论文日报</h1>
    <div class="updated" id="last-updated"></div>
    <nav></nav>
  </div>

  <div class="container">
    <div class="section">
      <div class="section-title">研究趋势</div>
      <div class="card">
        <div id="category-chart" class="chart-container-sm"></div>
      </div>
    </div>

    <div class="section" id="weekly-section" style="display:none">
      <div class="section-title" id="weekly-title">📅 本周最佳论文</div>
      <div id="weekly-list"></div>
    </div>

    <div class="section">
      <div class="section-title">今日论文</div>
      <div id="paper-list"></div>
    </div>
  </div>

  <div class="footer">Powered by OpenClaw + arXiv/Semantic Scholar | Auto-updated at 08:00 CST</div>

  <script src="assets/common.js"></script>
  <script>
    renderNav('papers');

    async function init() {
      const data = await loadData('papers.json');
      if (!data) {
        document.getElementById('paper-list').innerHTML = '<div class="card"><p style="color:var(--text-muted)">暂无数据 — 等待论文扫描 Cron 执行</p></div>';
        return;
      }

      document.getElementById('last-updated').textContent = `Updated: ${formatTime(data.updated_at || data.updated)}`;

      // Weekly top papers
      // Weekly digest: try newest known weekly file first, then older ones
      const WEEKLY_FILES = ['weekly-2026-11-21.json', 'weekly-2026-11-14.json', 'weekly-2026-04-26.json'];
      (async () => {
        let w = null;
        for (const f of WEEKLY_FILES) {
          w = await loadData(f);
          if (w && w.top_papers?.length) break;
        }
        return w;
      })().then(w => {
        if (!w || !w.top_papers?.length) return;
        document.getElementById('weekly-section').style.display = '';
        document.getElementById('weekly-title').textContent =
          `📅 ${w.title || '本周最佳论文'}`;
        const wl = document.getElementById('weekly-list');
        if (w.trend_note) {
          const note = document.createElement('div');
          note.className = 'card';
          note.style.marginBottom = '8px';
          note.innerHTML = `<div class="paper-summary" style="font-style:italic">${w.trend_note}</div>`;
          wl.appendChild(note);
        }
        w.top_papers.forEach((p, i) => {
          const card = document.createElement('div');
          card.className = 'card paper-card';
          card.style.marginBottom = '8px';
          card.innerHTML = `
            <div class="stars" style="color:var(--accent-yellow)">#${i + 1} ${starRating(p.relevance)} [${p.relevance}/5]</div>
            <div class="paper-title"><a href="${p.url}" target="_blank" style="color:var(--text-primary);text-decoration:none;">${p.title}</a></div>
            <div class="authors">${p.authors || ''} | arXiv:${p.id}</div>
            ${p.tags?.length ? `<div style="margin-top:6px">${p.tags.map(t => `<span class="badge badge-blue">${t}</span>`).join(' ')}</div>` : ''}
            <div class="paper-summary">${p.summary_cn || ''}</div>
          `;
          wl.appendChild(card);
        });
      });

      // Category chart
      if (data.category_counts) {
        const cats = Object.entries(data.category_counts).sort((a, b) => b[1] - a[1]);
        initChart('category-chart', {
          xAxis: { type: 'category', data: cats.map(c => c[0]), axisLabel: { rotate: 30 } },
          yAxis: { type: 'value', minInterval: 1 },
          series: [{ type: 'bar', data: cats.map(c => c[1]),
            itemStyle: { color: '#bc8cff' }, barWidth: 30 }],
          grid: { left: 40, right: 20, top: 10, bottom: 50 },
        });
      }

      // Paper cards
      const listEl = document.getElementById('paper-list');
      const scoreOf = p => p.score ?? p.relevance_score ?? 0;
      const urlOf = p => p.url || p.arxiv_url || (p.id ? `https://arxiv.org/abs/${p.id}` : '');
      const papers = (data.papers || []).sort((a, b) => scoreOf(b) - scoreOf(a));

      papers.forEach(p => {
        const score = scoreOf(p);
        const url = urlOf(p);
        const card = document.createElement('div');
        card.className = 'card paper-card';
        card.style.marginBottom = '8px';
        card.innerHTML = `
          <div class="stars" style="color:var(--accent-yellow)">${starRating(score)} [${score}/5]${p.status ? ` <span class="badge ${p.status === '新发现' ? 'badge-yellow' : 'badge-blue'}" style="margin-left:6px">${p.status}</span>` : ''}</div>
          <div class="paper-title">
            ${url ? `<a href="${url}" target="_blank" style="color:var(--text-primary);text-decoration:none;">${p.title}</a>` : p.title}
          </div>
          <div class="authors">${[].concat(p.authors || []).slice(0, 6).join(', ')} ${(p.arxiv_id || p.id) ? `| arXiv:${p.arxiv_id || p.id}` : ''}</div>
          ${p.categories?.length ? `<div style="margin-top:6px">${p.categories.map(c => `<span class="badge badge-blue">${c}</span>`).join(' ')}</div>` : ''}
          <div class="paper-summary">${p.summary || ''}</div>
        `;
        listEl.appendChild(card);
      });

      if (!papers.length) {
        listEl.innerHTML = '<div class="card"><p style="color:var(--text-muted)">今日无相关论文</p></div>';
      }
    }

    init();
  </script>
</body>
</html>
